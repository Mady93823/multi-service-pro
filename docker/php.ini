; Sized for a demo VPS, not for a benchmark.
memory_limit = 512M
max_execution_time = 120

; The seeder pushes ~20 photographs through medialibrary's conversion pipeline,
; and the checkout accepts four problem photos at once.
upload_max_filesize = 8M
post_max_size = 24M

; The translations editor posts the whole catalogue (~1000 keys) as ONE JSON
; body precisely because form fields would silently truncate at this limit
; (M14). Raised anyway, so nothing else quietly hits it.
max_input_vars = 5000

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
